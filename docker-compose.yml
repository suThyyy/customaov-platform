services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customaov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customaov}
      POSTGRES_DB: ${POSTGRES_DB:-customaov}
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customaov} -d ${POSTGRES_DB:-customaov}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
